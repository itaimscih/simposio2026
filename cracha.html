<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crachá Digital — II Simpósio IRAS e Stewardship</title>
    <style>
        :root { --blue:#003DA5; --blue-dark:#002855; --gold:#C6A27C; --gold-light:#F7CEA7; --white:#FFF; --muted:#6B7280; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Montserrat','Segoe UI',sans-serif;
            background:#001a35; color:var(--white); min-height:100vh;
            display:flex; align-items:center; justify-content:center; padding:16px;
        }
        .container { width:100%; max-width:420px; }

        /* Search screen */
        .search-card {
            background:var(--white); border-radius:16px; padding:24px 20px;
            text-align:center; color:#1A1E26;
        }
        .search-card h2 { font-size:1rem; color:var(--blue-dark); margin-bottom:4px; }
        .search-card .sub { font-size:0.78rem; color:var(--muted); margin-bottom:16px; }
        .search-card input {
            width:100%; padding:14px; border:2px solid #E2E6EC; border-radius:10px;
            font-size:0.95rem; font-family:inherit; text-align:center;
        }
        .search-card input:focus { outline:none; border-color:var(--blue); }
        .name-list { text-align:left; margin-top:8px; max-height:300px; overflow-y:auto; }
        .name-item {
            padding:12px 14px; border-radius:8px; cursor:pointer;
            font-size:0.85rem; font-weight:600; color:var(--blue-dark);
            border-bottom:1px solid #F0F2F5;
        }
        .name-item:hover, .name-item:active { background:#F0F4FF; }
        .name-item .sub { font-size:0.7rem; color:var(--muted); font-weight:400; }
        .hint { font-size:0.72rem; color:var(--muted); margin-top:10px; }

        /* Badge screen */
        .badge {
            background:linear-gradient(155deg,#002855,#001a3d);
            border-radius:20px; overflow:hidden;
            border:1px solid rgba(198,162,124,0.3);
            box-shadow:0 8px 40px rgba(0,0,0,0.4);
        }
        .badge-top { background:var(--blue); padding:22px 20px 18px; text-align:center; }
        .badge-top .event { font-size:8px; letter-spacing:2px; color:var(--gold-light); text-transform:uppercase; font-weight:700; margin-bottom:4px; }
        .badge-top h1 { font-size:14px; font-weight:800; line-height:1.3; }
        .badge-body { padding:22px 20px; text-align:center; }
        .avatar {
            width:72px; height:72px; border-radius:50%;
            background:rgba(113,197,232,0.15); margin:0 auto 14px;
            display:flex; align-items:center; justify-content:center;
            font-size:26px; font-weight:800; color:var(--gold);
            border:2px solid var(--gold);
        }
        .badge-name { font-size:18px; font-weight:800; margin-bottom:4px; }
        .badge-detail { font-size:12px; color:#71C5E8; margin-bottom:3px; }
        .badge-days { display:flex; gap:8px; justify-content:center; margin-top:14px; }
        .badge-day {
            padding:7px 16px; border-radius:20px; font-size:11px; font-weight:700;
        }
        .badge-day.on { background:#0a7a3a; color:#fff; }
        .badge-footer {
            border-top:1px solid rgba(255,255,255,0.1);
            padding:14px 20px; text-align:center; font-size:9px; color:rgba(255,255,255,0.5);
        }
        .badge-footer strong { color:var(--white); }
        .btn-back {
            display:block; margin:16px auto 0; padding:10px 24px;
            background:rgba(255,255,255,0.1); color:var(--white);
            border:1px solid rgba(255,255,255,0.2); border-radius:8px;
            font-size:0.8rem; cursor:pointer; font-family:inherit;
        }
    </style>
</head>
<body>

<div class="container" id="search-screen">
    <div class="search-card">
        <h2>Crachá Digital</h2>
        <p class="sub">II Simpósio de Prevenção de IRAS e Stewardship</p>
        <input type="text" id="name-input" placeholder="Digite parte do seu nome..." autofocus autocomplete="off">
        <div class="name-list" id="name-list"></div>
        <p class="hint">Disponível para inscritos com check-in confirmado</p>
    </div>
</div>

<div class="container" id="badge-screen" style="display:none;"></div>

<script>
    var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZWq5izGS2TFREGrYUj0p1V0ofYnVvNR-RVQGPfbyILIEXaQtEXf7QpcZyc_heqAhapVgfm7tftHUt/pub?gid=0&single=true&output=csv';
    var allCheckedIn = [];

    // Carregar lista de check-in ao abrir
    fetch(CSV_URL)
        .then(function(r) { return r.text(); })
        .then(function(csv) {
            var lines = csv.trim().split('\n');
            for (var i = 1; i < lines.length; i++) {
                var cols = lines[i].split(',');
                var nome = (cols[2]||'').replace(/"/g,'').trim();
                var d1 = !!(cols[9]||'').replace(/"/g,'').trim();
                var d2 = !!(cols[10]||'').replace(/"/g,'').trim();
                if (!d1 && !d2) continue;
                allCheckedIn.push({
                    nome: nome,
                    profissao: (cols[4]||'').replace(/"/g,'').trim(),
                    instituicao: (cols[5]||'').replace(/"/g,'').trim(),
                    d1: d1, d2: d2
                });
            }
        })
        .catch(function() {});

    // Busca enquanto digita
    document.getElementById('name-input').addEventListener('input', function() {
        var q = this.value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
        var list = document.getElementById('name-list');
        if (q.length < 2) { list.innerHTML = ''; return; }
        var matches = allCheckedIn.filter(function(p) {
            return p.nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').indexOf(q) > -1;
        });
        list.innerHTML = matches.slice(0, 15).map(function(p) {
            return '<div class="name-item" onclick="showBadge(\'' + escAttr(p.nome) + '\',\'' + escAttr(p.profissao) + '\',\'' + escAttr(p.instituicao) + '\',' + p.d1 + ',' + p.d2 + ')">' +
                esc(p.nome) + '<div class="sub">' + esc(p.profissao) + ' · ' + esc(p.instituicao) + '</div></div>';
        }).join('');
        if (q.length >= 3 && matches.length === 0) {
            list.innerHTML = '<div style="padding:12px;color:#999;font-size:0.82rem;">Nenhum nome encontrado</div>';
        }
    });

    function showBadge(nome, prof, inst, d1, d2) {
        document.getElementById('search-screen').style.display = 'none';
        var el = document.getElementById('badge-screen');
        el.style.display = 'block';
        var iniciais = nome.split(' ').slice(0,2).map(function(n){return n[0]||'';}).join('');
        el.innerHTML =
            '<div class="badge">' +
            '<div class="badge-top"><div class="event">Rede D\'Or · Regional Sul</div>' +
            '<h1>II Simpósio de Prevenção de IRAS<br>e Stewardship</h1></div>' +
            '<div class="badge-body">' +
            '<div class="avatar">' + iniciais + '</div>' +
            '<div class="badge-name">' + esc(nome) + '</div>' +
            '<div class="badge-detail">' + esc(prof) + '</div>' +
            '<div class="badge-detail">' + esc(inst) + '</div>' +
            '<div class="badge-days">' +
            '<div class="badge-day ' + (d1?'on':'off') + '">' + (d1?'✓ ':'') + 'Dia 1</div>' +
            '<div class="badge-day ' + (d2?'on':'off') + '">' + (d2?'✓ ':'') + 'Dia 2</div>' +
            '</div></div>' +
            '<div class="badge-footer">14 e 15 de Agosto · <strong>São Luiz Itaim</strong><br>Apresente esta tela no evento</div>' +
            '</div>' +
            '<button class="btn-back" onclick="location.reload()">← Buscar outro nome</button>';
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function escAttr(s) { return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
</script>
</body>
</html>
