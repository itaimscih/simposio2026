<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crachá Digital — II Simpósio IRAS e Stewardship</title>
    <style>
        :root { --blue:#003DA5; --blue-dark:#002855; --gold:#C6A27C; --white:#FFF; --text:#1A1E26; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Montserrat','Segoe UI',sans-serif;
            background:#001a35; color:var(--white);
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            padding:20px;
        }
        .badge {
            width:100%; max-width:380px;
            background:linear-gradient(155deg,#002855,#001a3d);
            border-radius:20px; overflow:hidden;
            box-shadow:0 8px 40px rgba(0,0,0,0.4);
            border:1px solid rgba(198,162,124,0.3);
        }
        .badge-top {
            background:var(--blue); padding:24px 20px 20px; text-align:center;
        }
        .badge-top .event { font-size:9px; letter-spacing:2px; color:#F7CEA7; text-transform:uppercase; font-weight:700; margin-bottom:6px; }
        .badge-top h1 { font-size:16px; font-weight:800; line-height:1.3; }
        .badge-body { padding:24px 20px; text-align:center; }
        .avatar {
            width:80px; height:80px; border-radius:50%;
            background:rgba(113,197,232,0.15); margin:0 auto 16px;
            display:flex; align-items:center; justify-content:center;
            font-size:28px; font-weight:800; color:var(--gold);
            border:2px solid var(--gold);
        }
        .badge-name { font-size:20px; font-weight:800; margin-bottom:6px; }
        .badge-detail { font-size:13px; color:#71C5E8; margin-bottom:4px; }
        .badge-days { display:flex; gap:10px; justify-content:center; margin-top:16px; }
        .badge-day {
            padding:8px 18px; border-radius:20px; font-size:12px; font-weight:700;
        }
        .badge-day.on { background:#0a7a3a; color:#fff; }
        .badge-day.off { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.4); }
        .badge-footer {
            border-top:1px solid rgba(255,255,255,0.1);
            padding:16px 20px; text-align:center; font-size:10px; color:rgba(255,255,255,0.5);
        }
        .badge-footer strong { color:var(--white); }
        .error { text-align:center; color:#ff9999; padding:40px; }
        .search-box {
            background:var(--white); border-radius:16px; padding:30px 24px;
            text-align:center; color:var(--text); max-width:400px; width:100%;
        }
        .search-box h2 { font-size:1rem; color:var(--blue-dark); margin-bottom:16px; }
        .search-box input {
            width:100%; padding:14px; border:2px solid #E2E6EC; border-radius:10px;
            font-size:1rem; font-family:inherit; text-align:center;
        }
        .search-box input:focus { outline:none; border-color:var(--blue); }
        .search-box button {
            margin-top:12px; width:100%; padding:14px; background:var(--blue);
            color:var(--white); border:none; border-radius:10px; font-size:1rem;
            font-weight:700; cursor:pointer; font-family:inherit;
        }
        .search-hint { font-size:0.75rem; color:var(--muted); margin-top:8px; }
    </style>
</head>
<body>

<div id="search-screen" class="search-box">
    <h2>Crachá Digital</h2>
    <p style="font-size:0.82rem;color:#6B7280;margin-bottom:14px;">II Simpósio de Prevenção de IRAS e Stewardship<br>14-15 Agosto 2026</p>
    <input type="text" id="name-input" placeholder="Digite seu nome completo" autofocus autocomplete="off">
    <button onclick="buscar()">Buscar meu crachá</button>
    <p class="search-hint">Disponível apenas para inscritos com check-in confirmado</p>
</div>

<div id="badge-screen" style="display:none;width:100%;max-width:380px;"></div>

<script>
    var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZWq5izGS2TFREGrYUj0p1V0ofYnVvNR-RVQGPfbyILIEXaQtEXf7QpcZyc_heqAhapVgfm7tftHUt/pub?gid=0&single=true&output=csv';

    document.getElementById('name-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') buscar();
    });

    function buscar() {
        var q = document.getElementById('name-input').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
        if (q.length < 3) return;

        fetch(CSV_URL)
            .then(function(r) { return r.text(); })
            .then(function(csv) {
                var lines = csv.trim().split('\n');
                var found = null;
                for (var i = 1; i < lines.length; i++) {
                    var cols = lines[i].split(',');
                    var nome = (cols[2]||'').replace(/"/g,'').trim(); // coluna C
                    var nomeN = nome.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
                    if (nomeN.indexOf(q) > -1) {
                        var d1 = !!(cols[9]||'').trim();  // coluna J
                        var d2 = !!(cols[10]||'').trim(); // coluna K
                        if (d1 || d2) {
                            found = {
                                nome: nome,
                                profissao: (cols[4]||'').replace(/"/g,'').trim(),  // E
                                instituicao: (cols[5]||'').replace(/"/g,'').trim(), // F
                                d1: d1, d2: d2
                            };
                            break;
                        }
                    }
                }
                if (found) showBadge(found);
                else alert('Crachá não encontrado. Verifique se seu nome está correto e se você já fez check-in no evento.');
            })
            .catch(function() { alert('Erro ao buscar. Tente novamente.'); });
    }

    function showBadge(p) {
        document.getElementById('search-screen').style.display = 'none';
        var el = document.getElementById('badge-screen');
        el.style.display = 'block';
        var iniciais = p.nome.split(' ').slice(0,2).map(function(n){return n[0];}).join('');
        el.innerHTML =
            '<div class="badge">' +
            '<div class="badge-top"><div class="event">Rede D\'Or · Regional Sul</div>' +
            '<h1>II Simpósio de Prevenção de IRAS<br>e Stewardship de Antimicrobianos</h1></div>' +
            '<div class="badge-body">' +
            '<div class="avatar">' + iniciais + '</div>' +
            '<div class="badge-name">' + esc(p.nome) + '</div>' +
            '<div class="badge-detail">' + esc(p.profissao) + '</div>' +
            '<div class="badge-detail">' + esc(p.instituicao) + '</div>' +
            '<div class="badge-days">' +
            '<div class="badge-day ' + (p.d1?'on':'off') + '">' + (p.d1?'✓ ':'') + 'Dia 1</div>' +
            '<div class="badge-day ' + (p.d2?'on':'off') + '">' + (p.d2?'✓ ':'') + 'Dia 2</div>' +
            '</div></div>' +
            '<div class="badge-footer">14 e 15 de Agosto de 2026 · <strong>São Luiz Itaim</strong><br>Apresente esta tela no evento</div>' +
            '</div>';
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
