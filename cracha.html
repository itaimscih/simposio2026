<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crachá Digital — II Simpósio IRAS e Stewardship</title>
    <style>
        :root { --blue:#003DA5; --blue-dark:#002855; --gold:#C6A27C; --gold-light:#F7CEA7; --white:#FFF; --muted:#6B7280; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Montserrat','Segoe UI',sans-serif;
            background:#001a35; color:var(--white); min-height:100vh;
            display:flex; align-items:center; justify-content:center; padding:16px;
        }
        .container { width:100%; max-width:400px; }
        .search-card {
            background:var(--white); border-radius:16px; padding:28px 22px;
            text-align:center; color:#1A1E26;
        }
        .search-card .icon { font-size:2.5rem; margin-bottom:8px; }
        .search-card h2 { font-size:1.05rem; color:var(--blue-dark); margin-bottom:4px; }
        .search-card .sub { font-size:0.76rem; color:var(--muted); margin-bottom:18px; line-height:1.4; }
        .search-card input {
            width:100%; padding:16px; border:2px solid #E2E6EC; border-radius:12px;
            font-size:1.4rem; font-family:monospace; text-align:center; letter-spacing:2px;
            -webkit-appearance:none; caret-color:var(--blue);
        }
        .search-card input:focus { outline:none; border-color:var(--blue); }
        .search-card input::placeholder { font-size:0.9rem; letter-spacing:1px; font-family:'Montserrat',sans-serif; }
        .hint { font-size:0.7rem; color:var(--muted); margin-top:12px; line-height:1.4; }
        .hint strong { color:var(--blue-dark); }
        .msg { font-size:0.82rem; margin-top:12px; padding:10px; border-radius:8px; display:none; }
        .msg.error { background:#fde8e8; color:#8b1a1a; display:block; }
        .msg.info { background:#e8f0fe; color:var(--blue); display:block; }

        /* Badge */
        .badge {
            background:linear-gradient(155deg,#002855,#001a3d);
            border-radius:20px; overflow:hidden;
            border:1px solid rgba(198,162,124,0.3);
            box-shadow:0 8px 40px rgba(0,0,0,0.4);
        }
        .badge-top { background:var(--blue); padding:22px 20px 18px; text-align:center; }
        .badge-top .event { font-size:8px; letter-spacing:2px; color:var(--gold-light); text-transform:uppercase; font-weight:700; margin-bottom:4px; }
        .badge-top h1 { font-size:14px; font-weight:800; line-height:1.3; }
        .badge-body { padding:22px 20px; text-align:center; }
        .avatar {
            width:72px; height:72px; border-radius:50%;
            background:rgba(113,197,232,0.15); margin:0 auto 14px;
            display:flex; align-items:center; justify-content:center;
            font-size:26px; font-weight:800; color:var(--gold);
            border:2px solid var(--gold);
        }
        .badge-name { font-size:18px; font-weight:800; margin-bottom:4px; }
        .badge-detail { font-size:12px; color:#71C5E8; margin-bottom:3px; }
        .badge-days { display:flex; gap:8px; justify-content:center; margin-top:14px; }
        .badge-day {
            padding:7px 16px; border-radius:20px; font-size:11px; font-weight:700;
        }
        .badge-day.on { background:#0a7a3a; color:#fff; }
        .badge-footer {
            border-top:1px solid rgba(255,255,255,0.1);
            padding:14px 20px; text-align:center; font-size:9px; color:rgba(255,255,255,0.5);
        }
        .badge-footer strong { color:var(--white); }
        .btn-back {
            display:block; margin:16px auto 0; padding:10px 24px;
            background:rgba(255,255,255,0.1); color:var(--white);
            border:1px solid rgba(255,255,255,0.2); border-radius:8px;
            font-size:0.8rem; cursor:pointer; font-family:inherit;
        }
    </style>
</head>
<body>

<div class="container" id="search-screen">
    <div class="search-card">
        <div class="icon">📱</div>
        <h2>Crachá Digital</h2>
        <p class="sub">II Simpósio de Prevenção de IRAS<br>e Stewardship de Antimicrobianos</p>
        <input type="text" id="cpf-input" placeholder="Digite seu CPF" maxlength="14" autofocus autocomplete="off" inputmode="numeric">
        <div class="msg" id="msg"></div>
        <p class="hint">Seu CPF foi informado na inscrição.<br><strong>Não será exibido na tela</strong> — usado apenas para localizar seu crachá.</p>
    </div>
</div>

<div class="container" id="badge-screen" style="display:none;"></div>

<script>
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynQvdo6oN-IHdYvamA8pwbLAllvmvZxzKlgpyTcNZaNLiowYyOMStzI85A68yDJRim/exec';

    // Mascara CPF enquanto digita
    var cpfInput = document.getElementById('cpf-input');
    cpfInput.addEventListener('input', function(e) {
        var val = this.value.replace(/\D/g,'');
        if (val.length > 11) val = val.slice(0,11);
        var masked = val;
        if (val.length > 9) masked = val.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4');
        else if (val.length > 6) masked = val.replace(/^(\d{3})(\d{3})(\d{1,3})$/,'$1.$2.$3');
        else if (val.length > 3) masked = val.replace(/^(\d{3})(\d{1,3})$/,'$1.$2');
        this.value = masked;
        document.getElementById('msg').className = 'msg';
        document.getElementById('msg').textContent = '';
    });

    cpfInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') buscar();
    });

    function buscar() {
        var raw = cpfInput.value.replace(/\D/g,'');
        var el = document.getElementById('msg');

        if (raw.length !== 11) {
            el.className = 'msg error';
            el.textContent = 'Digite os 11 dígitos do CPF.';
            return;
        }

        el.className = 'msg info';
        el.textContent = 'Buscando...';

        // JSONP via backend do check-in
        var cbName = '_badgeCb';
        window[cbName] = function(data) {
            if (data.found) {
                showBadge(data);
            } else {
                el.className = 'msg error';
                el.textContent = data.error === 'Check-in nao realizado' ?
                    'Seu CPF foi encontrado, mas o check-in ainda não foi realizado.' :
                    'Crachá não encontrado. Verifique o CPF digitado.';
            }
            delete window[cbName];
            document.head.removeChild(document.getElementById('scr_badge'));
        };
        var s = document.createElement('script');
        s.id = 'scr_badge';
        s.src = SCRIPT_URL + '?action=badge&cpf=' + raw + '&callback=' + cbName;
        s.onerror = function() {
            el.className = 'msg error';
            el.textContent = 'Erro de conexão. Tente novamente.';
        };
        document.head.appendChild(s);
    }

    function showBadge(p) {
        document.getElementById('search-screen').style.display = 'none';
        var el = document.getElementById('badge-screen');
        el.style.display = 'block';
        var iniciais = p.nome.split(' ').slice(0,2).map(function(n){return n[0]||'';}).join('');
        el.innerHTML =
            '<div class="badge">' +
            '<div class="badge-top"><div class="event">Rede D\'Or · Regional Sul</div>' +
            '<h1>II Simpósio de Prevenção de IRAS<br>e Stewardship</h1></div>' +
            '<div class="badge-body">' +
            '<div class="avatar">' + iniciais + '</div>' +
            '<div class="badge-name">' + esc(p.nome) + '</div>' +
            '<div class="badge-detail">' + esc(p.profissao) + '</div>' +
            '<div class="badge-detail">' + esc(p.instituicao) + '</div>' +
            '<div class="badge-days">' +
            '<div class="badge-day ' + (p.d1?'on':'off') + '">' + (p.d1?'✓ ':'') + 'Dia 1</div>' +
            '<div class="badge-day ' + (p.d2?'on':'off') + '">' + (p.d2?'✓ ':'') + 'Dia 2</div>' +
            '</div></div>' +
            '<div class="badge-footer">14 e 15 de Agosto · <strong>São Luiz Itaim</strong><br>Apresente esta tela no evento</div>' +
            '</div>' +
            '<button class="btn-back" onclick="location.reload()">← Buscar outro</button>';
    }

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
